[pytest]
pythonpath = .
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning:shap.*
    ignore::PendingDeprecationWarning:shap.*
    ignore::DeprecationWarning:sklearn.*
    ignore::DeprecationWarning:scipy.*
    ignore::DeprecationWarning:evidently.*
    ignore::RuntimeWarning:numpy.*
